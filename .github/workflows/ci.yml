name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: roottest
          MYSQL_DATABASE: nex_test
          MYSQL_USER: nex
          MYSQL_PASSWORD: nex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proottest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nex_test
      MYSQL_USER: nex
      MYSQL_PASSWORD: nex
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      JWT_EXPIRES_IN: 15m
      LGPD_DATA_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LGPD_HMAC_PEPPER: ci-hmac-pepper-not-for-production
      API_CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
